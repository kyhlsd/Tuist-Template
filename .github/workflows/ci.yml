# PR 과 main 푸시마다 lint 와 build-test 를 병렬로 돌린다.
#
# 러너: 저장소 변수 MACOS_RUNNER 가 있으면 그 라벨을, 없으면 xcode-27 을 쓴다.
#   Xcode 27 을 주는 GitHub 호스티드 러너는 xcode-27(preview) 뿐이다.
# Xcode 메이저를 올릴 때는 Tuist.swift 의 compatibleXcodeVersions 와
#   아래 기본 러너 라벨(또는 MACOS_RUNNER)을 함께 바꾼다.
# 앱·스킴·워크스페이스 이름은 이 파일에 없다. .claude/scripts/xcbuild.sh 한 곳에서 읽는다.
# 외부 액션은 태그가 옮겨져도 검토하지 않은 코드가 돌지 않도록 커밋 SHA 로 고정한다.
#   올릴 때는 새 태그의 SHA 와 뒤의 버전 주석을 함께 바꾼다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR 은 ref 로 묶어 새 커밋이 오면 이전 실행을 취소한다.
# main 은 커밋(sha)마다 그룹을 따로 둔다. 같은 그룹이면 cancel-in-progress 가 false 여도
# 대기 중인 실행이 새 실행에 밀려 취소되므로, 연달아 머지된 커밋의 결과가 빠진다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 도구 설치 (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: 포맷 검사 (SwiftFormat)
        run: swiftformat --lint .

      # --strict 를 붙이지 않는다(.swiftlint.yml 참고). error 심각도만 실패시킨다.
      - name: 린트 (SwiftLint)
        run: swiftlint lint --quiet

      - name: OpenAPI 생성물 검사
        run: Scripts/openapi-generate.sh --check

  build-test:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # lint 와 같은 mise 캐시 키를 쓰므로 mise.toml 전체를 설치한다.
      - name: 도구 설치 (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Xcode 버전
        run: xcodebuild -version

      # 복원과 저장을 나눈다. actions/cache 의 자동 저장은 잡이 성공해야만 돌아서,
      # 테스트가 깨지는 PR 에서는 매번 의존성을 처음부터 받게 된다.
      - name: SPM 의존성 캐시 복원
        id: spm-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tuist/.build
          key: tuist-build-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}
          restore-keys: |
            tuist-build-${{ runner.os }}-${{ runner.arch }}-

      - name: 의존성 설치 (tuist install)
        run: tuist install

      - name: SPM 의존성 캐시 저장
        if: steps.spm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: Tuist/.build
          key: ${{ steps.spm-cache.outputs.cache-primary-key }}

      - name: 프로젝트 생성 (tuist generate)
        run: tuist generate --no-open

      # 멈춘 테스트는 xcodebuild 가 테스트 타임아웃으로 끊는다. 그래도 끝나지 않으면 스텝 타임아웃이 끊는다.
      # 잡 타임아웃은 잡을 취소(cancelled)로 끝내 결과 업로드가 돌지 않지만,
      # 스텝 타임아웃은 실패(failure)로 끝나 업로드가 돈다.
      # 단, 이 보장은 테스트 앞 스텝들이 합쳐서 15분(잡 60분 - 스텝 45분) 안에 끝날 때만 성립한다.
      # 캐시 없는 첫 실행의 실제 시간을 재서 두 수치를 조정한다.
      # -collect-test-diagnostics never: 기본값(on-failure)이면 테스트가 하나라도 실패할 때 sysdiagnose 비슷한
      # 진단을 모으는데, 러너에서는 이것이 10분을 쓴다(로컬 14초). 실패 원인은 번들의 실패 메시지와 세션 로그로 충분하다.
      - name: 테스트
        id: test
        timeout-minutes: 45
        run: >-
          ./.claude/scripts/xcbuild.sh test
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
          -test-timeouts-enabled YES
          -collect-test-diagnostics never

      # Release 빌드를 테스트 뒤에 둔다. 테스트가 더 자주 깨지고,
      # 실패하면 .xcresult 번들을 먼저 확보해야 하기 때문이다.
      - name: Release 빌드
        run: ./.claude/scripts/xcbuild.sh build -configuration Release

      # 테스트 스텝이 실패했을 때만 올린다(Release 빌드만 깨졌을 때는 통과한 번들이라 올리지 않는다).
      # overwrite: 재실행이 같은 이름으로 다시 올려도 충돌하지 않게 한다.
      - name: 테스트 결과 업로드
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults.xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # 스냅샷 실패 이미지는 번들에도 첨부로 들어가지만, xcresult 를 열지 않고 PNG 로 바로 보도록 따로 올린다.
      # 위 스텝과 합치지 않는다. 경로가 여럿이면 공통 조상이 루트가 되어 xcresult 번들이 _temp/ 아래로 밀려난다.
      # 경로는 SnapshotSupport.swift 의 recordFailure 가 쓰는 기본 위치(테스트 소스 옆)다.
      - name: 스냅샷 실패 이미지 업로드
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SnapshotFailures
          path: Modules/**/__Snapshots__/__Failures__/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true
