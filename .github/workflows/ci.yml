# PR 과 main·develop 푸시마다 lint, build-test, release-build 세 잡을 병렬로 돌린다.
# main 대상 PR(출시·hotfix)에서는 release-archive 잡이 더 돈다.
#
# 러너: 저장소 변수 MACOS_RUNNER 가 있으면 그 라벨을, 없으면 xcode-27 을 쓴다.
#   Xcode 27 을 주는 GitHub 호스티드 러너는 xcode-27(preview) 뿐이다.
# Xcode 메이저를 올릴 때는 Tuist.swift 의 compatibleXcodeVersions 와
#   아래 기본 러너 라벨(또는 MACOS_RUNNER)을 함께 바꾼다.
# 앱·스킴·워크스페이스 이름은 이 파일에 없다. .claude/scripts/xcbuild.sh 와 Scripts/release.sh 가 정한다.
# 외부 액션은 태그가 옮겨져도 검토하지 않은 코드가 돌지 않도록 커밋 SHA 로 고정한다.
#   올릴 때는 새 태그의 SHA 와 뒤의 버전 주석을 함께 바꾼다.
name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# PR 은 ref 로 묶어 새 커밋이 오면 이전 실행을 취소한다.
# 푸시(main·develop)는 커밋(sha)마다 그룹을 따로 둔다. 같은 그룹이면 cancel-in-progress 가 false 여도
# 대기 중인 실행이 새 실행에 밀려 취소되므로, 연달아 머지된 커밋의 결과가 빠진다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 도구 설치 (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: 포맷 검사 (SwiftFormat)
        run: swiftformat --lint .

      # --strict 를 붙이지 않는다(.swiftlint.yml 참고). error 심각도만 실패시킨다.
      - name: 린트 (SwiftLint)
        run: swiftlint lint --quiet

      - name: OpenAPI 생성물 검사
        run: Scripts/openapi-generate.sh --check

  build-test:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 도구 설치, SPM 의존성, 프로젝트 생성. 내용은 .github/actions/setup/action.yml 에 있다.
      - name: 셋업
        uses: ./.github/actions/setup

      # 멈춘 테스트는 xcodebuild 가 테스트 타임아웃으로 끊는다. 그래도 끝나지 않으면 스텝 타임아웃이 끊는다.
      # 잡 타임아웃은 잡을 취소(cancelled)로 끝내 결과 업로드가 돌지 않지만,
      # 스텝 타임아웃은 실패(failure)로 끝나 업로드가 돈다.
      # 단, 이 보장은 테스트 앞 스텝들이 합쳐서 15분(잡 60분 - 스텝 45분) 안에 끝날 때만 성립한다.
      # 캐시 없는 첫 실행의 실제 시간을 재서 두 수치를 조정한다.
      # -collect-test-diagnostics never: 기본값(on-failure)이면 테스트가 하나라도 실패할 때 sysdiagnose 비슷한
      # 진단을 모으는데, 러너에서는 이것이 10분을 쓴다(로컬 14초). 실패 원인은 번들의 실패 메시지와 세션 로그로 충분하다.
      - name: 테스트
        id: test
        timeout-minutes: 45
        run: >-
          ./.claude/scripts/xcbuild.sh test
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
          -test-timeouts-enabled YES
          -collect-test-diagnostics never
          -enableCodeCoverage YES

      # 대상은 스킴의 codeCoverageTargets(앱과 모듈)다. 게이트는 없다. 표가 조용히 빠지지 않도록 실패하면 잡도 실패한다.
      - name: 커버리지 요약
        if: steps.test.outcome == 'success'
        run: Scripts/coverage-summary.sh "$RUNNER_TEMP/TestResults.xcresult" >> "$GITHUB_STEP_SUMMARY"

      # 테스트 스텝이 실패했을 때만 올린다.
      # overwrite: 재실행이 같은 이름으로 다시 올려도 충돌하지 않게 한다.
      - name: 테스트 결과 업로드
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults.xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # 스냅샷 실패 이미지는 번들에도 첨부로 들어가지만, xcresult 를 열지 않고 PNG 로 바로 보도록 따로 올린다.
      # 위 스텝과 합치지 않는다. 경로가 여럿이면 공통 조상이 루트가 되어 xcresult 번들이 _temp/ 아래로 밀려난다.
      # 경로는 SnapshotSupport.swift 의 recordFailure 가 쓰는 기본 위치(테스트 소스 옆)다.
      - name: 스냅샷 실패 이미지 업로드
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SnapshotFailures
          path: Modules/**/__Snapshots__/__Failures__/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # Release 에서만 나는 컴파일 에러(#if DEBUG 분기 등)와 모듈 의존 그래프의 어긋남을 PR 에서 잡는다.
  # build-test 와 병렬로 돌려 PR 의 크리티컬 패스에서 뺀다.
  release-build:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 셋업
        uses: ./.github/actions/setup

      # 테스트가 import 하는데 명시하지 않은 의존(implicit)과, 명시했지만 쓰지 않는 의존(redundant)을 잡는다.
      # lint 잡이 아니라 여기 두는 이유: 외부 의존(Firebase)까지 그래프를 읽으려면 셋업의 tuist install 이 필요하다.
      # build-test 에 두지 않는 이유: 여기서 실패해도 테스트 결과는 그대로 남기려고.
      - name: 의존성 검사 (tuist inspect)
        run: tuist inspect dependencies

      - name: Release 빌드
        run: ./.claude/scripts/xcbuild.sh build -configuration Release

  # 출시·hotfix PR(base main)에서만 서명 없이 Release 를 아카이브한다. 아카이브·스킴 문제를 머지 전에 잡는다.
  # 시크릿이 필요 없어 포크 PR 에서도 돈다. 다른 PR 에서는 skipped 라 required check 로 걸어도 막히지 않는다.
  release-archive:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 셋업
        uses: ./.github/actions/setup

      - name: Release 아카이브 (서명 없음)
        run: Scripts/release.sh archive Release --unsigned
        env:
          BUILD_NUMBER: 0
