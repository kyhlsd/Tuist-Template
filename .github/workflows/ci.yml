# PR 과 main 푸시마다 lint, build-test, release-build 세 잡을 병렬로 돌린다.
#
# 러너: 저장소 변수 MACOS_RUNNER 가 있으면 그 라벨을, 없으면 xcode-27 을 쓴다.
#   Xcode 27 을 주는 GitHub 호스티드 러너는 xcode-27(preview) 뿐이다.
# Xcode 메이저를 올릴 때는 Tuist.swift 의 compatibleXcodeVersions 와
#   아래 기본 러너 라벨(또는 MACOS_RUNNER)을 함께 바꾼다.
# 앱·스킴·워크스페이스 이름은 이 파일에 없다. .claude/scripts/xcbuild.sh 한 곳에서 읽는다.
# 외부 액션은 태그가 옮겨져도 검토하지 않은 코드가 돌지 않도록 커밋 SHA 로 고정한다.
#   올릴 때는 새 태그의 SHA 와 뒤의 버전 주석을 함께 바꾼다.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR 은 ref 로 묶어 새 커밋이 오면 이전 실행을 취소한다.
# main 은 커밋(sha)마다 그룹을 따로 둔다. 같은 그룹이면 cancel-in-progress 가 false 여도
# 대기 중인 실행이 새 실행에 밀려 취소되므로, 연달아 머지된 커밋의 결과가 빠진다.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 20
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 도구 설치 (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: 포맷 검사 (SwiftFormat)
        run: swiftformat --lint .

      # --strict 를 붙이지 않는다(.swiftlint.yml 참고). error 심각도만 실패시킨다.
      - name: 린트 (SwiftLint)
        run: swiftlint lint --quiet

      - name: OpenAPI 생성물 검사
        run: Scripts/openapi-generate.sh --check

  build-test:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 60
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 도구 설치, SPM 의존성, 프로젝트 생성. 내용은 .github/actions/setup/action.yml 에 있다.
      - name: 셋업
        id: setup
        uses: ./.github/actions/setup

      # Xcode 컴파일 캐시(CAS). 입력이 같은 컴파일 결과를 재사용한다. CI 에서만 켠다(xcbuild.sh 에 설정 인자로 넘긴다).
      # CAS 경로는 캐시 경로와 어긋나지 않도록 $RUNNER_TEMP/cas 로 고정한다.
      # 키에 커밋 SHA 를 넣는다. 키가 같으면 저장이 건너뛰어져 캐시가 갱신되지 않기 때문이다.
      # 복원은 SHA 를 뺀 접두사로 가장 최근 것을 받는다. Xcode 빌드, 주(cache-week), 의존성이 바뀌면 접두사가 달라져
      # 새로 시작한다. 주를 넣는 이유는 CAS 가 저장할 때마다 누적되기 때문이다(.github/actions/setup 참고).
      # PR 만 두 번째 restore-key 로 지난주 캐시를 받는다. 주가 바뀐 뒤 main 이 저장하기 전에도 PR 이 캐시를 쓰게 하려는 것이다.
      # PR 은 저장하지 않으므로 이 경로로는 쌓이지 않는다. main 에 주면 지난주 내용이 새 주로 넘어가 다시 누적된다.
      # PR 이 아니면 빈 줄이 되고, actions/cache 는 restore-keys 의 빈 줄을 버린다.
      - name: 컴파일 캐시 복원
        id: cas-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cas
          key: xcode-cas-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode-build }}-${{ steps.setup.outputs.cache-week }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            xcode-cas-test-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode-build }}-${{ steps.setup.outputs.cache-week }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}-
            ${{ github.event_name == 'pull_request' && format('xcode-cas-{0}-{1}-{2}-{3}-{4}-{5}-', 'test', runner.os, runner.arch, steps.setup.outputs.xcode-build, steps.setup.outputs.cache-prev-week, hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml')) || '' }}

      # 멈춘 테스트는 xcodebuild 가 테스트 타임아웃으로 끊는다. 그래도 끝나지 않으면 스텝 타임아웃이 끊는다.
      # 잡 타임아웃은 잡을 취소(cancelled)로 끝내 결과 업로드가 돌지 않지만,
      # 스텝 타임아웃은 실패(failure)로 끝나 업로드가 돈다.
      # 단, 이 보장은 테스트 앞 스텝들(셋업과 컴파일 캐시 복원)과 뒤 스텝들(업로드, 컴파일 캐시 저장)이 합쳐서
      # 15분(잡 60분 - 스텝 45분) 안에 끝날 때만 성립한다. 그래서 컴파일 캐시 저장은 업로드 뒤에 둔다.
      # 캐시 없는 첫 실행의 실제 시간을 재서 두 수치를 조정한다.
      # -collect-test-diagnostics never: 기본값(on-failure)이면 테스트가 하나라도 실패할 때 sysdiagnose 비슷한
      # 진단을 모으는데, 러너에서는 이것이 10분을 쓴다(로컬 14초). 실패 원인은 번들의 실패 메시지와 세션 로그로 충분하다.
      - name: 테스트
        id: test
        timeout-minutes: 45
        run: >-
          ./.claude/scripts/xcbuild.sh test
          -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult"
          -test-timeouts-enabled YES
          -collect-test-diagnostics never
          COMPILATION_CACHE_ENABLE_CACHING=YES
          COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cas"

      # 테스트 스텝이 실패했을 때만 올린다.
      # overwrite: 재실행이 같은 이름으로 다시 올려도 충돌하지 않게 한다.
      - name: 테스트 결과 업로드
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TestResults.xcresult
          path: ${{ runner.temp }}/TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # 스냅샷 실패 이미지는 번들에도 첨부로 들어가지만, xcresult 를 열지 않고 PNG 로 바로 보도록 따로 올린다.
      # 위 스텝과 합치지 않는다. 경로가 여럿이면 공통 조상이 루트가 되어 xcresult 번들이 _temp/ 아래로 밀려난다.
      # 경로는 SnapshotSupport.swift 의 recordFailure 가 쓰는 기본 위치(테스트 소스 옆)다.
      - name: 스냅샷 실패 이미지 업로드
        if: failure() && steps.test.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SnapshotFailures
          path: Modules/**/__Snapshots__/__Failures__/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      # PR 에서는 저장하지 않는다. 저장소 캐시 한도(10 GB)가 금방 차고, PR 은 base 브랜치(main)의 캐시를
      # 복원할 수 있으므로 main 푸시(와 효과 측정용 workflow_dispatch)에서만 저장하면 된다.
      # 테스트가 실패해도 컴파일 결과는 유효하므로 저장한다. 셋업이 실패해 테스트가 건너뛰어졌으면 저장할 것이 없다.
      # 컴파일 전에 실패해 CAS 디렉터리가 없으면 크기 스텝이 exists 를 내지 않고 저장도 건너뛴다.
      - name: 컴파일 캐시 크기
        id: cas-size
        if: >-
          !cancelled() && github.event_name != 'pull_request'
          && steps.test.outcome != 'skipped' && steps.cas-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -d "$RUNNER_TEMP/cas" ]]; then
            du -sh "$RUNNER_TEMP/cas"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "CAS 디렉터리가 없어 저장하지 않는다."
          fi

      - name: 컴파일 캐시 저장
        if: "!cancelled() && steps.cas-size.outputs.exists == 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cas
          key: ${{ steps.cas-cache.outputs.cache-primary-key }}

  # Release 에서만 나는 컴파일 에러(#if DEBUG 분기 등)를 PR 에서 잡는다.
  # build-test 와 병렬로 돌려 PR 의 크리티컬 패스에서 뺀다.
  release-build:
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - name: 체크아웃
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 셋업
        id: setup
        uses: ./.github/actions/setup

      # 컴파일 캐시는 build-test 와 같은 방식이다(주석은 그쪽 참고). 빌드 설정이 달라 키를 release 로 나눈다.
      - name: 컴파일 캐시 복원
        id: cas-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cas
          key: xcode-cas-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode-build }}-${{ steps.setup.outputs.cache-week }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}-${{ github.sha }}
          restore-keys: |
            xcode-cas-release-${{ runner.os }}-${{ runner.arch }}-${{ steps.setup.outputs.xcode-build }}-${{ steps.setup.outputs.cache-week }}-${{ hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml') }}-
            ${{ github.event_name == 'pull_request' && format('xcode-cas-{0}-{1}-{2}-{3}-{4}-{5}-', 'release', runner.os, runner.arch, steps.setup.outputs.xcode-build, steps.setup.outputs.cache-prev-week, hashFiles('Tuist/Package.resolved', 'Tuist/Package.swift', 'mise.toml')) || '' }}

      - name: Release 빌드
        id: build
        run: >-
          ./.claude/scripts/xcbuild.sh build -configuration Release
          COMPILATION_CACHE_ENABLE_CACHING=YES
          COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/cas"

      - name: 컴파일 캐시 크기
        id: cas-size
        if: >-
          !cancelled() && github.event_name != 'pull_request'
          && steps.build.outcome != 'skipped' && steps.cas-cache.outputs.cache-hit != 'true'
        run: |
          if [[ -d "$RUNNER_TEMP/cas" ]]; then
            du -sh "$RUNNER_TEMP/cas"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "CAS 디렉터리가 없어 저장하지 않는다."
          fi

      - name: 컴파일 캐시 저장
        if: "!cancelled() && steps.cas-size.outputs.exists == 'true'"
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/cas
          key: ${{ steps.cas-cache.outputs.cache-primary-key }}
